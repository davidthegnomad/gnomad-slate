name: Release Desktop Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to upload into
        required: true
        default: v2.1.0-beta.8
      only_label:
        description: Build only this matrix label, or all
        required: false
        default: macos-x64

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only_label || '' }}
        run: |
          python3 - << 'PY'
          import json, os
          rows = [
              {"platform": "ubuntu-latest", "projectPath": ".", "label": "linux", "target": ""},
              {"platform": "windows-latest", "projectPath": "slate_win64", "label": "windows", "target": ""},
              {"platform": "macos-latest", "projectPath": ".", "label": "macos-arm64", "target": "aarch64-apple-darwin"},
              {"platform": "macos-latest", "projectPath": ".", "label": "macos-x64", "target": "x86_64-apple-darwin"},
          ]
          only = os.environ.get("ONLY", "")
          if only:
              rows = [row for row in rows if row["label"] == only]
              if not rows:
                  raise SystemExit(f"unknown label: {only}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write("include=" + json.dumps(rows) + "\n")
          PY

  release:
    needs: select
    runs-on: ubuntu-latest
    steps:
      - name: Create the release before builds upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Gnomad Slate $TAG" \
            --latest \
            --notes "Desktop builds are uploading. See CHANGELOG.md."

  build:
    needs: [select, release]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.include) }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.projectPath == '.' && 'package-lock.json' || 'slate_win64/package-lock.json' }}

      - name: Install Rust target
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        working-directory: ${{ matrix.projectPath }}
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ matrix.projectPath }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: Gnomad Slate ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseBody: |
            ## Gnomad Slate ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

            See [CHANGELOG.md](https://github.com/davidthegnomad/gnomad-slate/blob/main/CHANGELOG.md) and [PLATFORM_LAYOUT.md](https://github.com/davidthegnomad/gnomad-slate/blob/main/docs/PLATFORM_LAYOUT.md).

            | Platform | Version | Tree |
            |----------|---------|------|
            | **macOS** | 2.1.0-beta.8 | repository root |
            | **Linux** | 2.1.0-beta.8 | repository root |
            | **Windows** | 1.0.0-alpha.1 | `slate_win64/` |

            **Downloads:** [GitHub Pages](https://davidthegnomad.github.io/gnomad-slate/)
          releaseDraft: false
          prerelease: false
