name: Release Desktop Builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            projectPath: .
            label: linux
          - platform: windows-latest
            projectPath: slate_win64
            label: windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            projectPath: .
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            projectPath: .
            label: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.projectPath == '.' && 'package-lock.json' || 'slate_win64/package-lock.json' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        working-directory: ${{ matrix.projectPath }}
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ matrix.projectPath }}
          tagName: ${{ github.ref_name }}
          releaseName: Gnomad Slate ${{ github.ref_name }}
          releaseBody: |
            ## Gnomad Slate ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/davidthegnomad/gnomad-slate/blob/main/CHANGELOG.md) and [PLATFORM_LAYOUT.md](https://github.com/davidthegnomad/gnomad-slate/blob/main/docs/PLATFORM_LAYOUT.md).

            | Platform | Version | Tree |
            |----------|---------|------|
            | **macOS** | 2.1.0-beta.7 | repository root |
            | **Linux** | 2.1.0-beta.7 | repository root |
            | **Windows** | 1.0.0-alpha.1 | `slate_win64/` |

            **Downloads:** [GitHub Pages](https://davidthegnomad.github.io/gnomad-slate/)
          releaseDraft: false
          prerelease: false
