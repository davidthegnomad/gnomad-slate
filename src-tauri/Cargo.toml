[package]
name = "tauri-app"
version = "2.1.0-beta.5"
description = "Gnomad Slate — desktop scratchpad and encrypted secrets vault"
authors = ["Gnomad Studio"]
edition = "2021"

[[bin]]
name = "gnomad-slate"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
rand = "0.8"
arboard = "3.6.1"
dirs = "6.0.0"
tauri-plugin-global-shortcut = "2.3.2"
sha2 = "0.11.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
tauri-plugin-updater = { version = "2.10.1", features = ["rustls-tls"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-store = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSRunningApplication"] }

