[package]
name = "tauri-app"
version = "1.0.0-alpha.1"
description = "Gnomad Slate — desktop scratchpad and encrypted secrets vault (Windows Edition)"
authors = ["Gnomad Studio"]
edition = "2021"

[[bin]]
name = "gnomad-slate"
path = "src/main.rs"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
rand = "0.8"
arboard = "3.6.1"
dirs = "6.0.0"
tauri-plugin-global-shortcut = "2.3.2"
sha2 = "0.11.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
tauri-plugin-updater = { version = "2.10.1", features = ["rustls-tls"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-store = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "libloaderapi", "processthreadsapi"] }
